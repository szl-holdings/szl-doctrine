# Org-wide required Actions-secret name audit.
#
# Authentication is App-first and fail-closed. qillqaq is requested with only the
# repository/organization secret-name read permissions required by this job. Until
# that installation capability is granted, the existing governed SZL_GITHUB_TOKEN
# is used as a bounded fallback. The expired SECRET_HEALTH_TOKEN is not consumed.
#
# GitHub's listing endpoints return names and timestamps, never secret values. The
# auditor persists names and PRESENT/MISSING/UNAVAILABLE states only.

name: secret-health

on:
  schedule:
    - cron: "30 6 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - .github/workflows/secret-health.yml
      - .github/data/required_actions_secrets.json
      - .github/scripts/secret_health.py
      - .github/scripts/test_secret_health.py

permissions:
  contents: read

concurrency:
  group: secret-health
  cancel-in-progress: true

jobs:
  audit:
    name: Governed organization secret-name health
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout governed policy and auditor
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Compile and test the fail-closed contract
        run: |
          set -euo pipefail
          python -m py_compile \
            .github/scripts/secret_health.py \
            .github/scripts/test_secret_health.py
          python .github/scripts/test_secret_health.py

      - name: Mint preferred qillqaq secret-name reader
        id: app-token
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.QILLQAQ_CLIENT_ID }}
          private-key: ${{ secrets.QILLQAQ_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-metadata: read
          permission-secrets: read
          permission-organization-secrets: read

      - name: Select governed machine identity without serializing it
        id: auth
        env:
          APP_OUTCOME: ${{ steps.app-token.outcome }}
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          GOVERNED_FALLBACK: ${{ secrets.SZL_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ "$APP_OUTCOME" = 'success' ] && [ -n "$APP_TOKEN" ]; then
            echo 'source=qillqaq-app' >> "$GITHUB_OUTPUT"
            echo 'available=true' >> "$GITHUB_OUTPUT"
          elif [ -n "$GOVERNED_FALLBACK" ]; then
            echo 'source=governed-fallback' >> "$GITHUB_OUTPUT"
            echo 'available=true' >> "$GITHUB_OUTPUT"
          else
            echo 'source=UNAVAILABLE' >> "$GITHUB_OUTPUT"
            echo 'available=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Audit required names and emit a redacted receipt
        id: audit
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.SZL_GITHUB_TOKEN }}
          SECRET_HEALTH_AUTH_SOURCE: ${{ steps.auth.outputs.source }}
        run: |
          set +e
          python .github/scripts/secret_health.py \
            --policy .github/data/required_actions_secrets.json \
            --report reports/secret-health.json
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload immutable secret-name health receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: secret-health-${{ github.run_id }}
          path: reports/secret-health.json
          if-no-files-found: error
          retention-days: 90

      - name: Enforce verified coverage
        if: always()
        env:
          EXIT_CODE: ${{ steps.audit.outputs.exit_code }}
          AUTH_AVAILABLE: ${{ steps.auth.outputs.available }}
          AUTH_SOURCE: ${{ steps.auth.outputs.source }}
        run: |
          set -euo pipefail
          code="${EXIT_CODE:-2}"
          if [ "$code" -ne 0 ]; then
            echo "::error::secret-health is not verified (source=${AUTH_SOURCE:-UNAVAILABLE}, available=${AUTH_AVAILABLE:-false}, exit=$code)."
            exit "$code"
          fi
          echo "Secret-name health verified through ${AUTH_SOURCE}."
