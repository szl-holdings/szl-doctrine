name: Required solo-builder provenance

# Compatibility note: the organization ruleset still points at this historical
# path and requires the legacy job context names. The jobs below intentionally
# validate event provenance only; they do not inspect commit signatures or
# require Signed-off-by trailers.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: solo-provenance-${{ github.repository }}-${{ github.event.pull_request.number || github.event.merge_group.head_sha }}
  cancel-in-progress: true

jobs:
  enforce-policy:
    # Keep this legacy context until the organization ruleset is renamed.
    name: Required DCO enforcement
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Validate protected event provenance
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REPOSITORY: ${{ github.event.repository.full_name }}
          EVENT_REPOSITORY_ID: ${{ github.event.repository.id }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MG_BASE_REF: ${{ github.event.merge_group.base_ref }}
          MG_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          MG_HEAD_REF: ${{ github.event.merge_group.head_ref }}
          MG_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
          WORKFLOW_REPOSITORY: ${{ github.repository }}
          WORKFLOW_REPOSITORY_ID: ${{ github.repository_id }}
          WORKFLOW_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$EVENT_REPOSITORY" = "$WORKFLOW_REPOSITORY"
          test "$EVENT_REPOSITORY_ID" = "$WORKFLOW_REPOSITORY_ID"
          [[ "$EVENT_REPOSITORY_ID" =~ ^[1-9][0-9]*$ ]]

          case "$EVENT_NAME" in
            pull_request)
              [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]
              test "$PR_BASE_REF" = "main"
              [[ "$PR_BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
              [[ "$PR_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
              test "$PR_BASE_SHA" != "$PR_HEAD_SHA"
              ;;
            merge_group)
              test "$MG_BASE_REF" = "refs/heads/main"
              [[ "$MG_BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
              [[ "$MG_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
              test "$MG_BASE_SHA" != "$MG_HEAD_SHA"
              test "$WORKFLOW_SHA" = "$MG_HEAD_SHA"
              case "$MG_HEAD_REF" in
                refs/heads/gh-readonly-queue/main/*) ;;
                *) echo "Merge-group head is outside the protected queue." >&2; exit 1 ;;
              esac
              ;;
            *)
              echo "Unsupported event: $EVENT_NAME" >&2
              exit 1
              ;;
          esac

          echo "Solo-builder provenance validated; no DCO trailer or commit signature was requested."

  status-compatibility:
    # Keep the old context green for repositories that still list it explicitly.
    name: DCO sign-off check
    needs: [enforce-policy]
    if: always()
    permissions: {}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Propagate the solo-builder provenance result
        env:
          PROVENANCE_RESULT: ${{ needs.enforce-policy.result }}
        shell: bash
        run: |
          set -euo pipefail
          test "$PROVENANCE_RESULT" = "success"
          echo "Legacy context retained for ruleset compatibility only; no sign-off was required."
