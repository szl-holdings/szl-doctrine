name: Secret Health Governed Fallback — Bounded Verification

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/diag-qillqaq-secret-health.yml
      - .github/workflows/secret-health.yml
      - .github/data/required_actions_secrets.json
      - .github/scripts/secret_health.py
      - .github/scripts/test_secret_health.py

permissions:
  contents: read

concurrency:
  group: secret-health-fallback-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    name: Prove App-first governed fallback without secret material
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Compile and test the production auditor
        run: |
          set -euo pipefail
          python -m py_compile \
            .github/scripts/secret_health.py \
            .github/scripts/test_secret_health.py
          python .github/scripts/test_secret_health.py
      - name: Attempt preferred qillqaq reader
        id: app-token
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.QILLQAQ_CLIENT_ID }}
          private-key: ${{ secrets.QILLQAQ_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-metadata: read
          permission-secrets: read
          permission-organization-secrets: read
      - name: Select source label without serializing an identity
        id: auth
        env:
          APP_OUTCOME: ${{ steps.app-token.outcome }}
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          GOVERNED_FALLBACK: ${{ secrets.SZL_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ "$APP_OUTCOME" = 'success' ] && [ -n "$APP_TOKEN" ]; then
            echo 'source=qillqaq-app' >> "$GITHUB_OUTPUT"
          elif [ -n "$GOVERNED_FALLBACK" ]; then
            echo 'source=governed-fallback' >> "$GITHUB_OUTPUT"
          else
            echo 'source=UNAVAILABLE' >> "$GITHUB_OUTPUT"
          fi
      - name: Run the exact production audit
        id: audit
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.SZL_GITHUB_TOKEN }}
          SECRET_HEALTH_AUTH_SOURCE: ${{ steps.auth.outputs.source }}
        run: |
          set +e
          python .github/scripts/secret_health.py \
            --policy .github/data/required_actions_secrets.json \
            --report reports/secret-health-fallback.json
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload immutable redacted receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: secret-health-fallback-${{ github.run_id }}
          path: reports/secret-health-fallback.json
          if-no-files-found: error
          retention-days: 30
      - name: Enforce governed coverage
        env:
          EXIT_CODE: ${{ steps.audit.outputs.exit_code }}
          AUTH_SOURCE: ${{ steps.auth.outputs.source }}
        run: |
          set -euo pipefail
          code="${EXIT_CODE:-2}"
          if [ "$code" -ne 0 ]; then
            echo "::error::governed secret-health failed closed through ${AUTH_SOURCE:-UNAVAILABLE} (exit=$code)."
            exit "$code"
          fi
          echo "Governed secret-health verified through ${AUTH_SOURCE}."
