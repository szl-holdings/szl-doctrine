name: qillqaq Secret Health — Bounded Capability Test

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/diag-qillqaq-secret-health.yml
      - .github/workflows/secret-health.yml

permissions:
  contents: read

concurrency:
  group: qillqaq-secret-health-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  capability:
    name: Prove short-lived App secret-name read capability
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Mint least-privilege qillqaq organization reader
        id: app-token
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.QILLQAQ_CLIENT_ID }}
          private-key: ${{ secrets.QILLQAQ_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-metadata: read
          permission-secrets: read
          permission-organization-secrets: read

      - name: Audit required secret names without reading values
        id: audit
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_TOKEN_OUTCOME: ${{ steps.app-token.outcome }}
        shell: python
        run: |
          import json
          import os
          import urllib.error
          import urllib.request
          from pathlib import Path

          org = 'szl-holdings'
          required = {
              'killinchu': 'HF_WRITE_TOKEN',
              'a11oy': 'HF_TOKEN',
              'szl-lake': 'HF_TOKEN',
              '.github': 'HF_TOKEN',
          }
          token = os.environ.get('GH_TOKEN', '')
          outcome = os.environ.get('APP_TOKEN_OUTCOME', 'unknown')

          def get_json(path: str):
              request = urllib.request.Request(
                  'https://api.github.com' + path,
                  headers={
                      'Accept': 'application/vnd.github+json',
                      'Authorization': f'Bearer {token}',
                      'X-GitHub-Api-Version': '2022-11-28',
                      'User-Agent': 'szl-qillqaq-secret-health/1',
                  },
              )
              try:
                  with urllib.request.urlopen(request, timeout=45) as response:
                      return response.status, json.loads(response.read() or b'{}'), None
              except urllib.error.HTTPError as exc:
                  return exc.code, {}, f'HTTP_{exc.code}'
              except Exception as exc:
                  return None, {}, type(exc).__name__

          report = {
              'schema': 'szl.qillqaq-secret-health-capability/v1',
              'app_token_outcome': outcome,
              'token_value_recorded': False,
              'token_metadata_recorded': False,
              'organization_secret_endpoint': {},
              'repositories': {},
              'ok': False,
          }

          org_status, org_payload, org_error = get_json(f'/orgs/{org}/actions/secrets?per_page=100')
          org_names = {
              item.get('name') for item in org_payload.get('secrets', [])
              if isinstance(item, dict) and isinstance(item.get('name'), str)
          }
          report['organization_secret_endpoint'] = {
              'status': org_status,
              'error_class': org_error,
              'readable': org_status == 200,
              'secret_count': len(org_names) if org_status == 200 else None,
          }

          all_ok = outcome == 'success' and org_status == 200
          for repo, secret_name in required.items():
              status, payload, error = get_json(
                  f'/repos/{org}/{repo}/actions/secrets?per_page=100'
              )
              repo_names = {
                  item.get('name') for item in payload.get('secrets', [])
                  if isinstance(item, dict) and isinstance(item.get('name'), str)
              }
              present = secret_name in repo_names or secret_name in org_names
              report['repositories'][repo] = {
                  'required_secret': secret_name,
                  'repository_endpoint_status': status,
                  'error_class': error,
                  'readable': status == 200,
                  'present': present if status == 200 and org_status == 200 else None,
              }
              all_ok = all_ok and status == 200 and present

          report['ok'] = bool(all_ok)
          Path('qillqaq-secret-health-capability.json').write_text(
              json.dumps(report, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          print(json.dumps(report, indent=2, sort_keys=True))
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f"ok={'true' if report['ok'] else 'false'}\n")

      - name: Upload immutable capability receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qillqaq-secret-health-${{ github.run_id }}
          path: qillqaq-secret-health-capability.json
          if-no-files-found: error
          retention-days: 30

      - name: Enforce permanent machine-identity capability
        env:
          OK: ${{ steps.audit.outputs.ok }}
        run: |
          if [ "${OK:-false}" != 'true' ]; then
            echo '::error::qillqaq cannot yet replace the expired PAT for secret-name health checks.'
            exit 1
          fi
          echo 'qillqaq can audit required secret names with short-lived least privilege.'
